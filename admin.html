<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL | AHMAD BHAI</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
        :root { --accent: #22c55e; --blue: #2563eb; --red: #ef4444; }
        body { background: #020617; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        
        .box { background: #0f172a; padding: 30px; border-radius: 25px; width: 450px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        /* Logo Zoom Animation */
        @keyframes zoomInOut {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .logo-img { 
            width: 80px; height: 80px; border-radius: 50%; 
            animation: zoomInOut 4s ease-in-out infinite;
            border: 2px solid var(--blue);
        }

        /* Panel User Logo Animation */
        .panel-logo {
            width: 30px; height: 30px; border-radius: 50%;
            animation: zoomInOut 3s ease-in-out infinite; /* Thoda fast animation panel ke liye */
            border: 1px solid var(--blue);
        }

        input { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #334155; background: #020617; color: var(--accent); box-sizing: border-box; outline: none; }
        
        .btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: white; border: none; width: 100%; padding: 14px; 
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; 
            transition: 0.3s;
        }
        .btn-blue { background: var(--blue); }
        .btn-icon { width: 20px; height: 20px; object-fit: contain; }

        .logout-btn { 
            position: absolute; top: 15px; right: 15px; background: var(--red); 
            color: white; border: none; padding: 8px 15px; border-radius: 8px; 
            cursor: pointer; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 5px;
        }

        .search-container { position: relative; margin-top: 20px; }
        .search-container input { padding-left: 45px; border-color: var(--blue); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; }

        .user-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--blue); }
        
        .del-btn { 
            background: var(--red); border: none; color: white; padding: 8px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 11px; 
            display: flex; align-items: center; gap: 6px; font-weight: bold;
        }
        .del-icon { width: 14px; height: 14px; }
        
        #errorMsg { color: var(--red); font-size: 12px; margin-top: 5px; display: none; font-weight: bold; }
        .error-border { border: 1px solid var(--red) !important; }

        #toast { visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); color: black; padding: 12px 25px; border-radius: 50px; font-weight: bold; z-index: 1000; }
        #toast.show { visibility: visible; animation: pop 0.3s ease; }
        @keyframes pop { from {bottom: 0; opacity:0;} to {bottom: 30px; opacity:1;} }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="toast">Done!</div>

<div id="loginBox" class="box hidden" style="margin-top:50px; text-align: center;">
    <div class="logo-container">
        <img src="logo.png" class="logo-img">
    </div>
    <h2>Login</h2>
    <input type="password" id="pass" placeholder="Enter Password" oninput="resetError()">
    <div id="errorMsg">Please enter a password !</div>
    <button class="btn btn-blue" onclick="login()">
        <img src="login.png" class="btn-icon"> Login
    </button>
</div>

<div id="panelBox" class="box hidden">
    <button class="logout-btn" onclick="logout()">
        <img src="logout.png" style="width:14px; height:14px;"> LOGOUT
    </button>
    
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
        <img src="logo.png" class="panel-logo">
        <h3 style="margin:0; color:var(--blue);">User Manager</h3>
    </div>
    
    <input type="text" id="n" placeholder="User Name">
    <input type="text" id="i" placeholder="20-Digit Device ID">
    <input type="date" id="d">
    
    <button class="btn btn-blue" onclick="add()">
        <img src="upgrade.png" class="btn-icon"> UPGRADE
    </button>

    <div class="search-container">
        <img src="search.png" class="search-icon">
        <input type="text" id="s" placeholder="Search User by Name or ID..." onkeyup="search()">
    </div>
    
    <div id="list" style="max-height: 350px; overflow-y: auto; margin-top: 10px;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDS3Vc-QJScL5UnpHAd3ZV-Sk-57plSjKI", 
        authDomain: "reactions-maker-site.firebaseapp.com", 
        projectId: "reactions-maker-site", 
        databaseURL: "https://reactions-maker-site-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    window.onload = function() {
        if(localStorage.getItem('admin_session') === 'true') { showPanel(); } 
        else { showLogin(); }
    };

    function showToast(m) { 
        let t=document.getElementById('toast'); 
        t.innerText=m; t.classList.add('show'); 
        setTimeout(()=>t.classList.remove('show'), 2000); 
    }

    function login() {
        let p = document.getElementById('pass');
        let e = document.getElementById('errorMsg');
        if(p.value.trim() === "") {
            p.classList.add('error-border');
            e.style.display = 'block';
            return;
        }
        if(p.value === "181314") {
            localStorage.setItem('admin_session', 'true');
            showPanel();
            showToast("Welcome Ahmad Bhai!");
        } else { showToast("Wrong Password!"); }
    }

    function resetError() {
        document.getElementById('pass').classList.remove('error-border');
        document.getElementById('errorMsg').style.display = 'none';
    }

    function logout() {
        localStorage.removeItem('admin_session');
        showLogin();
        showToast("Logged Out");
    }

    function showPanel() {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('panelBox').classList.remove('hidden');
        loadData();
    }

    function showLogin() {
        document.getElementById('panelBox').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('pass').value = "";
    }

    function add() {
        let u = { 
            name: document.getElementById('n').value, 
            id: document.getElementById('i').value.trim(), 
            date: document.getElementById('d').value 
        };
        if(u.name && u.id) {
            db.ref('users').push(u).then(() => {
                showToast("User Upgraded!");
                ["n","i","d"].forEach(id => document.getElementById(id).value = "");
            });
        }
    }

    function loadData() {
        db.ref('users').on('value', s => {
            let h = "";
            s.forEach(c => {
                let v = c.val();
                let exp = v.date ? `<br><small style="color:var(--blue)">Expiry: ${v.date}</small>` : "";
                h += `<div class="user-card" data-s="${v.name.toLowerCase()} ${v.id}">
                    <span>
                        <b>${v.name}</b><br>
                        <small style="color:gray">${v.id}</small>${exp}
                    </span>
                    <button class="del-btn" onclick="del('${c.key}')">
                        <img src="delete.png" class="del-icon"> Delete
                    </button>
                </div>`;
            });
            document.getElementById('list').innerHTML = h || "<p style='text-align:center; opacity:0.5'>No Users</p>";
        });
    }

    function search() {
        let v = document.getElementById('s').value.toLowerCase();
        document.querySelectorAll('.user-card').forEach(u => {
            u.style.display = u.getAttribute('data-s').includes(v) ? "flex" : "none";
        });
    }

    function del(k) { db.ref('users').child(k).remove().then(() => showToast("Removed")); }
</script>
</body>
</html>
