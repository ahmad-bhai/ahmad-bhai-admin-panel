<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL | AHMAD TRADER</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
        :root { 
            --accent:#22c55e; --blue:#2563eb; --red:#ef4444; 
            --bg:#020617; --card:#0f172a; --text:#ffffff; --border:#1e293b; --input-bg:#020617;
        }
        body.light-mode { 
            --bg:#f1f5f9; --card:#ffffff; --text:#000000; --border:#cbd5e1; --input-bg:#f8fafc;
        }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; display:flex; justify-content:center; padding:20px; transition:0.3s;}
        
        .box { background:var(--card); padding:30px; border-radius:30px; width:450px; border:1px solid var(--border); box-shadow:0 20px 40px rgba(0,0,0,0.2); position:relative; overflow: hidden;}
        
        .header-section { position:relative; text-align:center; margin-bottom:25px; padding-top:10px;}
        .logo-img { width:100px; height:100px; border-radius:50%; animation:zoomInOut 4s infinite; border:3px solid var(--blue);}
        @keyframes zoomInOut {0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
        
        /* Token Source Section Styling */
        .token-source-panel {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid var(--blue);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 12px;
        }
        .source-item { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding: 5px 0; }
        .source-item:last-child { border: none; }

        .input-group { margin: 8px 0; position: relative; }
        input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--input-bg); color:var(--accent); font-weight: bold; outline: none; box-sizing: border-box; transition: 0.3s; margin-bottom: 10px;}
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; background:var(--blue); color:white; border:none; width:100%; padding:15px; border-radius:12px; cursor:pointer; font-weight:bold; margin-top:12px;}
        .logout-btn { position:absolute; top:15px; left:15px; background:var(--red); color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size:11px; font-weight:bold; z-index: 10;}
        
        #toast { visibility:hidden; position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--blue); color:white; padding:12px 25px; border-radius:50px; font-weight:bold; z-index:100;}
        #toast.show { visibility:visible; animation: pop 0.3s ease; }
        .hidden { display:none !important; }

        #toggleBox { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); display: none; }
        .t-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--blue); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div id="toast">Done!</div>

<div id="loginBox" class="box">
    <div class="header-section">
        <img src="logo.png" class="logo-img">
    </div>
    <h2 style="text-align:center;">Admin Panel Login</h2>
    <input type="password" id="pass" placeholder="Enter Admin Password">
    <button class="btn" onclick="login()">Secure Login</button>
</div>

<div id="panelBox" class="box hidden">
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
    <div class="header-section">
        <img src="logo.png" class="logo-img">
        <h3 style="color:var(--blue);">TOKEN SOURCES (ACTIVE)</h3>
    </div>

    <div class="token-source-panel" id="tokenSources">
        <div class="source-item"><span><b>Source ID</b></span><span><b>Status</b></span></div>
        <div id="sourceList">Loading sources...</div>
    </div>

    <input type="text" id="admin_n" placeholder="Admin Note" oninput="showToggles()">
    <input type="text" id="i" placeholder="20-Digit Device ID" maxlength="20" oninput="showToggles()">
    <input type="text" id="trader_id" placeholder="Trader ID">

    <div id="toggleBox">
        <div class="t-row"><span>Mobile Live</span><label class="switch"><input type="checkbox" id="t_android" checked><span class="slider"></span></label></div>
        <div class="t-row"><span>PC Live</span><label class="switch"><input type="checkbox" id="t_pc" checked><span class="slider"></span></label></div>
        <div class="t-row"><span>Loss/Win Logic</span><label class="switch"><input type="checkbox" id="t_win" checked><span class="slider"></span></label></div>
        <button class="btn" style="padding:5px; font-size:10px;" onclick="document.getElementById('toggleBox').style.display='none'">CLOSE SETTINGS</button>
    </div>

    <button class="btn" onclick="add()">UPGRADE USER</button>
    <div id="list" style="max-height:200px; overflow-y:auto; margin-top:15px;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
// --- HEAVY SECURITY LOGIC ---

// 1. Domain & Network Security
const checkSecurity = () => {
    const authDomain = "ahmad-bhai-admin-panel.vercel.app";
    if (window.location.hostname !== authDomain && window.location.hostname !== "localhost") {
        logout(); // Kill session on unknown domain
    }
    if (!navigator.onLine) {
        logout(); // Logout on network loss
    }
};

window.addEventListener('offline', () => {
    alert("Network lost. Security Logout.");
    logout();
});

// 2. Firebase Init
const firebaseConfig = { 
    apiKey:"AIzaSyDS3Vc-QJScL5UnpHAd3ZV-Sk-57plSjKI",
    authDomain:"reactions-maker-site.firebaseapp.com",
    projectId:"reactions-maker-site",
    databaseURL:"https://reactions-maker-site-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// 3. Token Sources / Active Sessions Tracker
function updateTokenSources() {
    db.ref('users').limitToLast(5).on('value', snapshot => {
        let html = "";
        snapshot.forEach(child => {
            const user = child.val();
            html += `<div class="source-item">
                <span>${user.id.substring(0,8)}...</span>
                <span style="color:var(--accent)">● ${user.status || 'Active'}</span>
            </div>`;
        });
        document.getElementById('sourceList').innerHTML = html || "No active tokens";
    });
}

// 4. Core Functions
function login(){
    let email="nasiriq703@gmail.com";
    let pass = document.getElementById('pass').value;
    auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Access Denied"));
}

function logout(){
    auth.signOut();
    location.reload();
}

auth.onAuthStateChanged(user => {
    if(user){
        checkSecurity();
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('panelBox').classList.remove('hidden');
        updateTokenSources();
        loadUsers();
    }
});

function showToggles() {
    let ad = document.getElementById('admin_n').value;
    let id = document.getElementById('i').value;
    document.getElementById('toggleBox').style.display = (ad && id) ? "block" : "none";
}

function add() {
    let ad = document.getElementById('admin_n').value;
    let id = document.getElementById('i').value;
    if(ad && id){
        db.ref('users').push({
            admin_note: ad,
            id: id,
            trader_id: document.getElementById('trader_id').value,
            status: "active",
            timestamp: Date.now()
        }).then(() => alert("User Authorized"));
    }
}

function loadUsers(){
    db.ref('users').on('value', s => {
        let h = "";
        s.forEach(c => {
            let v = c.val();
            h += `<div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-top:5px; font-size:12px;">
                <b>${v.admin_note}</b> - ID: ${v.id}
            </div>`;
        });
        document.getElementById('list').innerHTML = h;
    });
}

// Initial Security Check
setInterval(checkSecurity, 5000);
</script>
</body>
</html>
